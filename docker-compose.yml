# docker-compose.yml
version: '3.8'

services:
  secureqa-suite:
    build: .
    container_name: secureqa-suite
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./temp:/app/temp:rw
      - ./logs:/app/logs:rw
      - ./reports:/app/reports:rw
    networks:
      - secureqa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço nginx para proxy reverso (opcional)
  nginx:
    image: nginx:alpine
    container_name: secureqa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - secureqa-suite
    networks:
      - secureqa-network

networks:
  secureqa-network:
    driver: bridge

volumes:
  temp_data:
  logs_data:
  reports_data: